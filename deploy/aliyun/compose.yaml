name: kaitu
services:
  app:
    image: kaitu-app:${RELEASE_ID:?}
    build:
      context: ${RELEASE_DIR:?}
      dockerfile: deploy/aliyun/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      KAITU_API_TOKEN: ${KAITU_API_TOKEN:?}
      KAITU_ALLOW_SHORT_TOKEN: ${KAITU_ALLOW_SHORT_TOKEN:-false}
      DATA_DIR: /data
      MAX_UPLOAD_MB: 512
    ports: ["127.0.0.1:${KAITU_PORT:?}:8080"]
    volumes: [kaitu-data:/data]
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
  worker:
    image: kaitu-worker:${RELEASE_ID:?}
    build:
      context: ${RELEASE_DIR:?}
      dockerfile: deploy/aliyun/Dockerfile
      target: worker
    restart: unless-stopped
    init: true
    mem_limit: 384m
    cpus: 0.65
    pids_limit: 100
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: {DATA_DIR: /data}
    volumes: [kaitu-data:/data]
    depends_on:
      app: {condition: service_healthy}
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: [CMD, node, -e, "require('node:child_process').execFileSync('ffprobe',['-version']);if(!require('node:fs').existsSync('/data/kaitu.sqlite'))process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  kaitu-data:
