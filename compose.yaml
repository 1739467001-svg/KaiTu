services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      KAITU_API_TOKEN: ${KAITU_API_TOKEN:?Run node scripts/init-env.mjs first}
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - kaitu-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATA_DIR: /data
    volumes:
      - kaitu-data:/data
    depends_on:
      app:
        condition: service_healthy
  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      KAITU_DOMAIN: ${KAITU_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  kaitu-data:
  caddy-data:
  caddy-config:
